<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANPA | Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8">
        <div class="text-center mb-8">
          <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-600 text-2xl font-bold">A</div>
          <h1 class="mt-4 text-2xl font-bold text-slate-900">ANPA Comedor</h1>
          <p class="mt-2 text-sm text-slate-500">Accede a tu área privada</p>
        </div>

        {% if error %}
        <div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-700">Email</label>
            <input type="email" name="email" id="email" value="{{ email or '' }}" required class="block w-full rounded-xl {% if error %}border-red-300 bg-red-50 text-red-700{% else %}border-slate-300 bg-slate-50{% endif %} px-3.5 py-2.5 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="familia@ejemplo.com" />
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-700">Contraseña</label>
            <input type="password" name="password" id="password" required class="block w-full rounded-xl {% if error %}border-red-300 bg-red-50 text-red-700{% else %}border-slate-300 bg-slate-50{% endif %} px-3.5 py-2.5 text-slate-900 shadow-sm placeholder:text-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" placeholder="••••••••" />
          </div>

          <button type="submit" class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200">Iniciar sesión</button>
        </form>

        <div class="mt-6 rounded-xl bg-slate-100 px-4 py-3 text-xs text-slate-600">
          Acceso demo para administrador: <span class="font-semibold">admin@anpa.es</span> / <span class="font-semibold">Admin1234!</span>
        </div>
      </div>
    </div>
  </body>
</html>
