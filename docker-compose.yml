services:
  anpa-app:
    image: ${ANPA_IMAGE:-anpa}:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: anpa-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/comedor.db
      COOKIE_SECURE: "true"
      APP_VERSION: ${APP_VERSION:-latest}
    ports:
      - "8000:8000"
    volumes:
      - anpa_data:/data

volumes:
  anpa_data:
