services:
  anpa-app:
    image: ${ANPA_IMAGE:-ghcr.io/ccouso/anpa}:${APP_VERSION:-latest}
    pull_policy: always
    container_name: anpa-app
    restart: unless-stopped
    environment:
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      DATABASE_URL: sqlite:////data/comedor.db
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_VERSION: ${APP_VERSION:-latest}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - anpa_data:/data

volumes:
  anpa_data:
